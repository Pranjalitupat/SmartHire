<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartHire - Job Matches</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">🎯 SmartHire</a>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
</nav>

<div class="container mt-4">

    <h3>💼 Your Job Matches</h3>
    <p class="text-muted">Based on your resume skills</p>

    <!-- Error -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- Resume Skills -->
    <div th:if="${resume}" class="card mb-4 shadow-sm">
        <div class="card-body">
            <h5>📄 Your Skills</h5>
            <p th:text="${resume.extractedSkills}" class="text-primary fw-bold"></p>
        </div>
    </div>

    <!-- Job Matches -->
    <div th:if="${matches}">
        <div th:each="match, iterStat : ${matches}" class="card mb-3 shadow-sm">
            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center">
                    <h5 th:text="${iterStat.index + 1} + '. ' + ${match.job.jobTitle}"></h5>

                    <!-- Score Badge -->
                    <span th:classappend="${match.matchScore >= 80} ? 'bg-success' :
                                         (${match.matchScore >= 60} ? 'bg-warning' : 'bg-danger')"
                          class="badge fs-6"
                          th:text="${match.matchScore} + '%'">
                    </span>
                </div>

                <!-- Match Label -->
                <span th:classappend="${match.matchLabel == 'STRONG MATCH'} ? 'text-success' :
                                      (${match.matchLabel == 'GOOD MATCH'} ? 'text-warning' : 'text-danger')"
                      class="fw-bold"
                      th:text="${match.matchLabel}">
                </span>

                <hr/>

                <!-- Matched Skills -->
                <p><strong>✅ Matched Skills:</strong>
                    <span th:each="skill : ${match.matchedSkills}">
                        <span class="badge bg-success me-1" th:text="${skill}"></span>
                    </span>
                </p>

                <!-- Missing Skills -->
                <p><strong>❌ Missing Skills:</strong>
                    <span th:each="skill : ${match.missingSkills}">
                        <span class="badge bg-danger me-1" th:text="${skill}"></span>
                    </span>
                </p>

                <p class="text-muted mb-0">
                    <small>Experience Level:
                        <strong th:text="${match.job.experienceLevel}"></strong>
                    </small>
                </p>
                <a th:href="@{/skillgap/{id}(id=${match.job.id})}"
   					class="btn btn-sm btn-outline-primary mt-2">
    				📊 View Skill Gap
				</a>
				<a th:href="@{/apply/{id}(id=${match.job.id})}"
   					class="btn btn-sm btn-success mt-2 ms-1">
   					 ✅ Apply Now
				</a>
            </div>
        </div>
    </div>

    <a href="/upload" class="btn btn-outline-primary mt-2">
        ← Upload New Resume
    </a>
    <a href="/dashboard" class="btn btn-outline-secondary mt-2">
        🏠 Dashboard
    </a>

</div>
</body>
</html>
