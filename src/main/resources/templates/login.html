<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartHire - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body p-4">

                    <h3 class="text-center mb-4">🎯 SmartHire</h3>
                    <h5 class="text-center text-muted mb-4">Login to your account</h5>

                    <!-- Success message after register -->
                    <div th:if="${param.registered}" class="alert alert-success">
                        Registration successful! Please login.
                    </div>

                    <!-- Error message -->
                    <div th:if="${param.error}" class="alert alert-danger">
                        Invalid email or password!
                    </div>

                    <form th:action="@{/login}" method="post">
    				<div class="mb-3">
        			<label class="form-label">Email</label>
        			<input type="email" name="email" class="form-control" 
               		placeholder="Enter email" required>
    				</div>
   					 <div class="mb-3">
       				 <label class="form-label">Password</label>
       				 <input type="password" name="password" class="form-control" 
              		 placeholder="Enter password" required>
   					 </div>
    <button type="submit" class="btn btn-primary w-100">Login</button>
</form>

                    <p class="text-center mt-3">
                        Don't have an account? <a th:href="@{/register}">Register here</a>
                    </p>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
