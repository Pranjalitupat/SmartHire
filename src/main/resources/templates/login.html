<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartHire - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error-msg {
            color: red;
            font-size: 12px;
            margin-top: 4px;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body p-4">

                    <h3 class="text-center mb-2">🎯 SmartHire</h3>
                    <h5 class="text-center text-muted mb-4">
                        Login to your account
                    </h5>

                    <!-- Success message -->
                    <div th:if="${param.registered}"
                         class="alert alert-success">
                        ✅ Registration successful! Please login.
                    </div>

                    <!-- Error message -->
                    <div th:if="${param.error}"
                         class="alert alert-danger">
                        ❌ Invalid email or password!
                        Please try again.
                    </div>

                    <form th:action="@{/login}"
                          method="post"
                          id="loginForm"
                          onsubmit="return validateLogin()">

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Email
                            </label>
                            <input type="email"
                                   name="email"
                                   id="loginEmail"
                                   class="form-control"
                                   placeholder="Enter email"
                                   required>
                            <div id="loginEmailError"
                                 class="error-msg"
                                 style="display:none">
                                Please enter valid email!
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Password
                            </label>
                            <input type="password"
                                   name="password"
                                   id="loginPassword"
                                   class="form-control"
                                   placeholder="Enter password"
                                   required>
                            <div id="loginPassError"
                                 class="error-msg"
                                 style="display:none">
                                Password cannot be empty!
                            </div>
                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100">
                            Login
                        </button>

                    </form>

                    <p class="text-center mt-3">
                        Don't have an account?
                        <a th:href="@{/register}">Register here</a>
                    </p>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
function validateLogin() {

    let isValid = true;

    // Hide errors
    document.getElementById("loginEmailError")
            .style.display = "none";
    document.getElementById("loginPassError")
            .style.display = "none";

    // Get values
    let email = document.getElementById("loginEmail")
                        .value.trim();
    let password = document.getElementById("loginPassword")
                           .value;

    // Validate email
    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(email)) {
        document.getElementById("loginEmailError")
                .style.display = "block";
        isValid = false;
    }

    // Validate password
    if (password.length === 0) {
        document.getElementById("loginPassError")
                .style.display = "block";
        isValid = false;
    }

    return isValid;
}
</script>

</body>
</html>
