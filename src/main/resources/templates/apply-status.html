<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartHire - Application Status</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">🎯 SmartHire</a>
        <a href="/logout"
           class="btn btn-outline-light btn-sm">Logout</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <!-- Success -->
            <div th:if="${success}" class="card shadow text-center p-4">
                <div style="font-size:4rem">🎉</div>
                <h4 class="text-success mt-2">Application Submitted!</h4>
                <p th:text="${success}"></p>
                <p>Your Match Score:
                    <strong class="text-primary fs-4"
                            th:text="${score} + '%'">
                    </strong>
                </p>
                <hr/>
                <a href="/match"
                   class="btn btn-primary me-2">
                   View More Jobs
                </a>
                <a href="/my-applications"
                   class="btn btn-outline-success">
                   My Applications
                </a>
            </div>

            <!-- Already Applied -->
            <div th:if="${error}" class="card shadow text-center p-4">
                <div style="font-size:4rem">⚠️</div>
                <h4 class="text-warning mt-2">Already Applied!</h4>
                <p th:text="${error}"></p>
                <a href="/match"
                   class="btn btn-primary me-2">
                   View More Jobs
                </a>
                <a href="/my-applications"
                   class="btn btn-outline-primary">
                   My Applications
                </a>
            </div>

        </div>
    </div>
</div>
</body>
</html>
