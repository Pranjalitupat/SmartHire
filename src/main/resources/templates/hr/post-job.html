<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartHire - Post Job</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/hr/dashboard">
            🎯 SmartHire — HR Panel
        </a>
        <a href="/logout"
           class="btn btn-outline-light btn-sm">Logout</a>
    </div>
</nav>

<div class="container mt-4">
    <h3>➕ Post New Job</h3>
    <p class="text-muted">Fill details to post a new job opening</p>

    <!-- Success -->
    <div th:if="${success}"
         class="alert alert-success"
         th:text="${success}">
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <form th:action="@{/hr/post-job}" method="post">

                <div class="mb-3">
                    <label class="form-label fw-bold">Job Title</label>
                    <input type="text" name="jobTitle"
                           class="form-control"
                           placeholder="e.g. Java Backend Developer"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">
                        Job Description
                    </label>
                    <textarea name="jobDescription"
                              class="form-control" rows="4"
                              placeholder="Describe the role..."
                              required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">
                        Required Skills
                        <small class="text-muted fw-normal">
                            (comma separated)
                        </small>
                    </label>
                    <input type="text" name="requiredSkills"
                           class="form-control"
                           placeholder="Java, Spring Boot, MySQL, Git"
                           required>
                    <small class="text-muted">
                        Enter skills separated by commas
                    </small>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">
                            Experience Level
                        </label>
                        <select name="experienceLevel"
                                class="form-select">
                            <option value="FRESHER">Fresher</option>
                            <option value="JUNIOR">Junior</option>
                            <option value="MID">Mid Level</option>
                            <option value="SENIOR">Senior</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">
                            Location
                        </label>
                        <input type="text" name="location"
                               class="form-control"
                               placeholder="e.g. Nagpur, Mumbai, Remote">
                    </div>
                </div>

                <button type="submit"
                        class="btn btn-success w-100">
                    ➕ Post Job
                </button>

            </form>
        </div>
    </div>

    <a href="/hr/dashboard"
       class="btn btn-outline-secondary mt-3">
       ← Back to Dashboard
    </a>
</div>
</body>
</html>
