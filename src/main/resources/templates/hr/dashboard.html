<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartHire - HR Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold">🎯 SmartHire — HR Panel</a>
        <div>
            <span class="text-white me-3"
                  th:text="'👋 ' + ${user.fullName}"></span>
            <a href="/logout"
               class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <!-- Welcome -->
    <div class="card bg-dark text-white shadow mb-4">
        <div class="card-body p-4">
            <h3 th:text="'Welcome, ' + ${user.fullName} + '! 👋'"></h3>
            <p class="mb-0">HR Manager Dashboard — SmartHire</p>
        </div>
    </div>

    <!-- Stats -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card shadow-sm text-center p-3">
                <div style="font-size:2rem">💼</div>
                <h6 class="text-muted">Total Jobs Posted</h6>
                <span class="fw-bold fs-3 text-primary"
                      th:text="${totalJobs}"></span>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm text-center p-3">
                <div style="font-size:2rem">👥</div>
                <h6 class="text-muted">Total Applications</h6>
                <span class="fw-bold fs-3 text-success"
                      th:text="${totalApplications}"></span>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm text-center p-3">
                <div style="font-size:2rem">➕</div>
                <h6 class="text-muted">Post New Job</h6>
                <a href="/hr/post-job"
                   class="btn btn-primary btn-sm mt-1">
                   Post Job
                </a>
            </div>
        </div>
    </div>

    <!-- Jobs List -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white d-flex 
                    justify-content-between align-items-center">
            <span>💼 Your Job Postings</span>
            <a href="/hr/post-job"
               class="btn btn-success btn-sm">
               + Post New Job
            </a>
        </div>
        <div class="card-body">
            <div th:if="${myJobs.empty}"
                 class="text-center text-muted p-4">
                No jobs posted yet.
                <a href="/hr/post-job">Post your first job!</a>
            </div>

            <table th:unless="${myJobs.empty}"
                   class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Job Title</th>
                        <th>Required Skills</th>
                        <th>Level</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="job, i : ${myJobs}">
                        <td th:text="${i.index + 1}"></td>
                        <td class="fw-bold"
                            th:text="${job.jobTitle}"></td>
                        <td>
                            <small th:text="${job.requiredSkills}"
                                   class="text-muted"></small>
                        </td>
                        <td>
                            <span class="badge bg-primary"
                                  th:text="${job.experienceLevel}">
                            </span>
                        </td>
                        <td>
                            <a th:href="@{/hr/candidates/{id}
                                        (id=${job.id})}"
                               class="btn btn-sm btn-success me-1">
                               👥 Candidates
                            </a>
                            <form th:action="@{/hr/delete-job/
                                  {id}(id=${job.id})}"
                                  method="post"
                                  style="display:inline">
                                <button type="submit"
                                        class="btn btn-sm btn-danger"
                                        onclick="return confirm(
                                        'Delete this job?')">
                                    🗑 Delete
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
